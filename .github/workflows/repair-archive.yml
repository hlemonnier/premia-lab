name: Repair archived file identities
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-archive.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'hlemonnier/continual-research-takehome'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore approved bytes only; no branches or settings are changed
        run: |
          python tools/repair_archive.py --repair > research/ARCHIVE_STORAGE_REPAIR.json
          git add research/archive/objects
          python tools/repair_archive.py --staged > research/ARCHIVE_STORAGE_CHECK.json
          python -m unittest discover -s tests -v
          python tools/check_project.py
      - name: Commit verified archive bytes
        run: |
          git config user.name 'Hugo Lemonnier'
          git config user.email '130443320+hlemonnier@users.noreply.github.com'
          git add research/ARCHIVE_STORAGE_REPAIR.json research/ARCHIVE_STORAGE_CHECK.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve exact archived CSV bytes and include indexed research logs'
          git push origin HEAD:main
