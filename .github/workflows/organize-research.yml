name: Consolidate research archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/organize-research.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'hlemonnier/continual-research-takehome'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Set archival commit identity
        run: |
          git config user.name 'Hugo Lemonnier'
          git config user.email '130443320+hlemonnier@users.noreply.github.com'
      - name: Archive, verify, preserve history, then remove recorded branch refs
        run: python tools/consolidate_remote.py
