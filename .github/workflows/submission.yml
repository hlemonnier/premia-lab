name: Submission package
on:
  push:
    branches: [main, submission-ready-f-20261029]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: submission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
          cache: pip
      - name: Install the audited runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the exported package and causal E2E paths
        run: python .github/scripts/check_submission.py
      - name: Retain the ready-to-submit ZIP and check receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: F-submission-${{ github.sha }}
          path: |
            dist/Continual_Research_Submission.zip
            dist/Continual_Research_Submission.checks.json
          if-no-files-found: error
          retention-days: 30
